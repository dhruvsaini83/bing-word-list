name: Daily Trending Words Update

on:
  schedule:
    # Runs daily at 12:00 AM IST (18:30 UTC)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-words:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate daily fresh words
        run: python generate_words.py

      - name: Commit updated words.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add words.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily fresh trending words"
            git push
          fi
